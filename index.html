<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geovisor REDD+ - Territorios Indígenas y Visitas</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Estilos propios -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Panel Lateral Izquierdo -->
  <div id="sidebar" class="sidebar">
    <h2>Información del Territorio</h2>

    <!-- Territorio Seleccionado -->
    <div class="card">
      <small>TERRITORIO SELECCIONADO</small>
      <h3 id="info-nombre">Haz clic en un territorio</h3>
    </div>

    <!-- Nubes de Información (Año Contrato y Bloque) -->
    <div class="nubes-container">
      <div class="badge-card">
        <small>AÑO CONTRATO</small>
        <span id="info-anio">-</span>
      </div>
      <div class="badge-card">
        <small>BLOQUE</small>
        <span id="info-bloque">-</span>
      </div>
    </div>

    <!-- Clasificación y Decreto -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
        <span><strong>Clasificación:</strong> <span id="info-clasif">-</span></span>
        <span><strong>Decreto:</strong> <span id="info-decreto">-</span></span>
      </div>
    </div>

    <!-- Tabla de Área Efectiva por Año (2018 - 2024) -->
    <div class="card">
      <small>ÁREA EFECTIVA APROBADA POR AÑO (HA)</small>
      <table class="tabla-anios">
        <thead>
          <tr>
            <th>Año</th>
            <th>Área (ha)</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>2018</td><td id="ae-2018">-</td></tr>
          <tr><td>2019</td><td id="ae-2019">-</td></tr>
          <tr><td>2020</td><td id="ae-2020">-</td></tr>
          <tr><td>2021</td><td id="ae-2021">-</td></tr>
          <tr><td>2022</td><td id="ae-2022">-</td></tr>
          <tr><td>2023</td><td id="ae-2023">-</td></tr>
          <tr><td>2024</td><td id="ae-2024">-</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Contenedor principal del Mapa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Script principal del visor -->
  <script src="script.js"></script>
</body>
</html>
