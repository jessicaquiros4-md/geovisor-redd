<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geovisor Interactivo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Geovisor de Territorios Indígenas</h1>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <h2>Información del Territorio</h2>

      <div class="card">
        <h3>Territorio Seleccionado</h3>
        <p id="info-nombre">Haz clic en un territorio en el mapa</p>
      </div>

      <div class="card">
        <h3>Área Efectiva</h3>
        <p><span id="info-area">-</span> hectáreas</p>
      </div>
    </aside>

    <main id="map"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
